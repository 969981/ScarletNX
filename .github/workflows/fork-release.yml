name: Release successful upstream sync

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: scarletnx-sync-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == '969981/ScarletNX' &&
      (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'push') &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exactly the successfully built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      # Upstream Build includes experimental cross-architectures and diagnostics.
      # Never publish if a supported release platform or its install check failed,
      # but do not block all supported artifacts on unrelated experimental failures.
      - name: Require passing release builds and installed-artifact checks
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs?per_page=100" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv' > "$RUNNER_TEMP/scarletnx-build-jobs.tsv"
          python3 - "$RUNNER_TEMP/scarletnx-build-jobs.tsv" <<'PY'
          from pathlib import Path
          import sys

          required = {
              "Linux (x86_64)",
              "Linux (aarch64)",
              "Linux AppImage (x86_64)",
              "Linux AppImage (aarch64)",
              "Linux AppImage (x86_64), as installed",
              "Linux AppImage (aarch64), as installed",
              "Windows (Clang + LLVM)",
              "Windows zip, as installed",
              "Android APK",
              "macOS and iOS (arm64)",
          }
          jobs = {}
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              name, status = line.split("\t", 1)
              jobs[name] = status
          blocked = sorted((name, jobs.get(name, "missing")) for name in required
                           if jobs.get(name) != "success")
          if blocked:
              for name, status in blocked:
                  print(f"::error::Required release job {name}: {status}")
              sys.exit(1)
          print(f"Verified {len(required)} required build and installation jobs.")
          optional_failures = sorted(name for name, status in jobs.items()
                                     if name not in required and status == "failure")
          if optional_failures:
              print("::warning::Optional/experimental Build jobs failed: "
                    + ", ".join(optional_failures))
          PY

      - name: Verify sync provenance and deduplicate releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          if [[ ! "$subject" =~ ^chore\(sync\):\ upstream\ ([0-9a-f]{40})$ ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Not a sync commit: $subject"
            exit 0
          fi
          upstream_sha="${BASH_REMATCH[1]}"
          tag="upstream-${upstream_sha:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Already published $tag"
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: Download, package and publish successful build artifacts
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fork-release.py --repo "$GITHUB_REPOSITORY" --run "$BUILD_RUN" --sha "$BUILD_SHA" --out release
          notes=$(printf 'Automatically synchronized and built from [scarletnx/ScarletNX](https://github.com/scarletnx/ScarletNX).\n\n- Upstream commit: `%s`\n- Built commit: `%s`\n- [Build and test run](https://github.com/%s/actions/runs/%s)\n- Release assets include SHA256SUMS.txt for integrity checks.\n' "$UPSTREAM_SHA" "$BUILD_SHA" "$GITHUB_REPOSITORY" "$BUILD_RUN")
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" \
            --title "ScarletNX upstream ${UPSTREAM_SHA:0:12}" \
            --notes "$notes" \
            --prerelease
